<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TP2 - Attendance & Add Student</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- === NAVIGATION === -->
  <nav class="nav">
    <a href="#home" class="left">Home</a>
    <a href="#attendance">Attendance List</a>
    <a href="#add">Add Student</a>
    <a href="#">Reports</a>

  </nav>

      <th colspan="6">Participation (P1–P6)</th>
      <th>Absences</th>
      <th>Participations</th>
      <th>Message</th>
    </tr>

    <tr>

      <td><input type="checkbox"></td>
      <td><input type="checkbox"></td>

      <td><input type="checkbox" checked></td>
      <td><input type="checkbox"></td>
      <td><input type="checkbox"></td>
      <td><input type="checkbox"></td>
      <td><input type="checkbox"></td>
      <td><input type="checkbox"></td>

      <td class="abs"></td>
      <td class="par"></td>
      <td class="msg"></td>

      <td><input type="checkbox" checked></td>

      <td><input type="checkbox" checked></td>
      <td><input type="checkbox" checked></td>
      <td><input type="checkbox" checked></td>
      <td><input type="checkbox"></td>
      <td><input type="checkbox" checked></td>
      <td><input type="checkbox" checked></td>

      <td><input type="checkbox" checked></td>
      <td><input type="checkbox" checked></td>
      <td><input type="checkbox"></td>
      <td><input type="checkbox" checked></td>
      <td><input type="checkbox" checked></td>
      <td><input type="checkbox"></td>

      <td><input type="checkbox" checked></td>

    </tr>
  </table>

  <!-- === FORM TO ADD STUDENT === -->
  <h1 id="add">Add New Student</h1>
  <form id="studentForm" action="#" method="post">
    <label for="studentId">Student ID:</label>
    <input type="text" id="studentId" name="studentId">
    <small class="error" id="idError"></small>

    <label for="lastName">Last Name:</label>
    <input type="text" id="lastName" name="lastName">
    <small class="error" id="lastNameError"></small>

    <label for="firstName">First Name:</label>
    <input type="text" id="firstName" name="firstName">
    <small class="error" id="firstNameError"></small>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email">
    <small class="error" id="emailError"></small>

    <button type="submit">Add Student</button>
  </form>

  <!-- === REPORT SECTION === -->
  <div class="report-section">
    <button id="generateReport">Generate Report</button>
    <div id="reportOutput"></div>
    <canvas id="reportChart" width="300" height="300"></canvas>
  </div>

  <!-- === JS Libraries & Script === -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
